[project]
name = "rag-from-scratch-v1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ujjwal Dalmia", email = "ujjwal@gspdfinserve.com.au" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.2.0",
    "chromadb>=1.5.9",
    "pypdf[crypto]>=6.21.1",
    "python-dotenv>=1.2.4",
    "voyageai>=0.5.0",
]

[project.scripts]
rag-from-scratch-v1 = "rag_from_scratch_v1:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
